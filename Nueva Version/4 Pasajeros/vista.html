<div id="timer" class="d-none"
    style="font-size:10px;font-weight:bold;top: 50px;right: 25px;position: fixed;color: black;z-index: 1;">Tiempo:
    <span id="timerValue">10:00</span>
</div>
<div>
    <div class="header-basic-expreso-brasilia d-flex justify-content-between align-items-center"
        style="position: relative; background: #123d67;height: 80px;">
        <img src="https://static.unitransco.com/wp-content/uploads/2025/09/u.png" alt="Unitransco" style="background: #fff;
    border-radius: 25px;
    margin: 16px;
    padding: 5px;
    width: 44px;">
        <button id="lastStep2" class="btn btn-outline-primary"
            style="background-color: #ffffff00 !important; border: none !important;"><span
                style="margin-right: 3px;">Modificar Búsqueda </span><i class="fa fa-search"></i></button>
    </div>
    <div class="checkout-container">
        <!-- Header del flujo -->
        <div class="checkout-header d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="checkout-title mb-0">¿Quiénes viajan?</h4>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="step-indicator">Paso 1 de 3</span>
                <button id="closeModalBtn" class="btn-close-custom" aria-label="Cerrar">&times;</button>
            </div>
        </div>

        <!-- Alert informativo sobre factura electrónica -->
        <div class="info-alert-banner d-flex align-items-center mb-3">
            <div class="info-icon-wrapper">
                <i class="fa fa-info-circle"></i>
            </div>

            <div class="info-alert-text">
                Los datos del titular de la compra se usarán para emitir la factura electrónica.
            </div>
        </div>

        <!-- Contenedor con borde envolvente como en el mockup -->
        <div class="main-form-wrapper">
            <!-- Opciones adicionales (Copiar datos) -->
            <div class="form-check mb-3 px-2" id="copyContactContainer">
                <input type="checkbox" id="copyContact" class="form-check-input copy-first-passenger-data">
                <label class="form-check-label ms-1" for="copyContact">
                    Copiar correo y celular del primer pasajero
                </label>
            </div>

            <!-- Aquí se renderizan las tarjetas y formularios dinámicos -->
            <div id="passengerForms"></div>

            <!-- Botones de acción: Limpiar formulario y Guardar cambios -->
            <div class="d-flex gap-2 mt-3">
                <button type="button" id="clearPassengersBtn" class="btn btn-clear-passenger">Limpiar formulario</button>
                <button id="addPassangers" class="btn btn-confirm-passenger" disabled>
                    Guardar cambios
                </button>
            </div>

            <!-- Seguros del viaje (visible al completar todos los pasajeros) -->
            <div id="insuranceSection" class="d-none mt-3">
                <div class="insurance-card">
                    <div class="insurance-header">
                        <div class="insurance-description">
                            <h5 class="insurance-title mb-1">Viaja más seguro</h5>
                            <button type="button" id="insuranceDetailsToggle" class="insurance-details-toggle"
                                aria-expanded="false" aria-controls="insuranceDetails">
                                Ver detalles <span class="insurance-chevron" aria-hidden="true">⌄</span>
                            </button>
                        </div>
                        <div class="insurance-price">
                            <span id="insurancePerPassenger">$0</span>
                            <span class="insurance-price-unit">COP c/u</span>
                            <label class="form-check form-switch insurance-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="travelInsuranceSwitch" role="switch"
                                    aria-label="Agregar seguro de viaje" disabled>
                            </label>
                        </div>
                    </div>
                    <p id="insuranceStatus" class="insurance-status mb-0" role="status">Cargando seguro...</p>
                    <div id="insuranceDetails" class="insurance-details" hidden></div>
                </div>
            </div>

            <!-- Texto legal para tratamiento de datos -->
            <div id="legalSection" class="d-none mt-3">
                <div class="legal-card">
                    <h6 class="legal-title mb-2">Tratamiento de datos</h6>
                    <div id="legalTexts" class="small text-muted"></div>
                </div>
                <button type="button" id="continueToPaymentBtn" class="btn btn-confirm-passenger w-100 mt-3" disabled>
                    Continuar a pago
                </button>
            </div>
        </div>
    </div>
</div>

<div id="birthDateModal" class="date-modal hidden">
    <div class="date-sheet">
        <div class="date-header">
            <div>
                <h2>Selecciona fecha</h2>
                <span id="birthDateModalLabel">Fecha de nacimiento</span>
            </div>
            <button type="button" id="closeBirthDateModal"
                style="transform: translate(350px, -60px);border: none;background: none;">✕</button>
        </div>

        <div id="birthDateCalendar"></div>

        <button type="button" class="btn-accept" id="acceptBirthDate" disabled>
            Aceptar
        </button>
    </div>
</div>
